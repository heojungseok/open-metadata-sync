name: open-metadata-sync-public-demo

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  mysql:
    image: mysql:8.4.10@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6
    container_name: open-metadata-sync-public-demo-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: open_metadata
      MYSQL_USER: open_metadata
      MYSQL_PASSWORD_FILE: /run/secrets/demo_mysql_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/demo_mysql_root_password
    secrets:
      - demo_mysql_password
      - demo_mysql_root_password
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - public-demo-mysql-data:/var/lib/mysql
      - ./docker/public-demo-mysql-init:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$(cat /run/secrets/demo_mysql_root_password) mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 300
    security_opt:
      - no-new-privileges:true
    logging: *bounded-logging

  live-db-bootstrap:
    profiles: ["bootstrap"]
    image: mysql:8.4.10@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6
    entrypoint: ["/bin/bash", "/opt/demo/scripts/demo-bootstrap-live-db.sh"]
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/demo_mysql_root_password
      LIVE_DB_PASSWORD_FILE: /run/secrets/demo_mysql_live_password
      DEMO_BOOTSTRAP_ACK: CREATE_LIVE_DEMO
    secrets:
      - demo_mysql_root_password
      - demo_mysql_live_password
    volumes:
      - ./scripts:/opt/demo/scripts:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - data
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    logging: *bounded-logging

  live-migrate:
    profiles: ["bootstrap"]
    image: open-metadata-sync-demo-agent:${DEMO_IMAGE_TAG:?DEMO_IMAGE_TAG is required}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        export DB_PASSWORD="$$(cat /run/secrets/demo_mysql_live_password)"
        java -jar /opt/open-metadata-sync/build/libs/open-metadata-sync-0.0.1-SNAPSHOT.jar \
          --spring.batch.job.enabled=false --spring.profiles.active=actual
        MYSQL_PWD="$$DB_PASSWORD" mysql --protocol=TCP -hmysql -P3306 -uopen_metadata_live_demo \
          open_metadata_live_demo < /opt/open-metadata-sync/scripts/demo-install-live-sentinel.sql
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: open_metadata_live_demo
      DB_USERNAME: open_metadata_live_demo
    secrets:
      - demo_mysql_live_password
    depends_on:
      mysql:
        condition: service_healthy
      live-db-bootstrap:
        condition: service_completed_successfully
    networks:
      - data
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    logging: *bounded-logging

  replay-migrate:
    profiles: ["bootstrap"]
    image: open-metadata-sync-demo-agent:${DEMO_IMAGE_TAG:?DEMO_IMAGE_TAG is required}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        export DB_PASSWORD="$$(cat /run/secrets/demo_mysql_password)"
        java -jar /opt/open-metadata-sync/build/libs/open-metadata-sync-0.0.1-SNAPSHOT.jar \
          --spring.batch.job.enabled=false --spring.profiles.active=actual
        MYSQL_PWD="$$DB_PASSWORD" mysql --protocol=TCP -hmysql -P3306 -uopen_metadata \
          open_metadata < /opt/open-metadata-sync/scripts/demo-install-sentinel.sql
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: open_metadata
      DB_USERNAME: open_metadata
    secrets:
      - demo_mysql_password
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - data
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    logging: *bounded-logging

  legacy-demo-cleanup:
    profiles: ["cleanup"]
    image: open-metadata-sync-demo-agent:${DEMO_IMAGE_TAG:?DEMO_IMAGE_TAG is required}
    entrypoint: ["/bin/bash", "/opt/open-metadata-sync/scripts/demo-cleanup-legacy.sh"]
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/demo_mysql_root_password
      RECOVERY_RECEIPT_FILE: /recovery/recovery-receipt.env
      RECOVERY_MANIFEST_FILE: /recovery/SHA256SUMS
      RECOVERY_MANIFEST_SIGNATURE_FILE: /recovery/SHA256SUMS.sig
      RECOVERY_RECEIPT_SIGNATURE_FILE: /recovery/recovery-receipt.env.sig
      RECOVERY_KEY_FILE: /run/secrets/recovery_key
      LIVE_VALIDATION_RECEIPT_FILE: /validation/live-validation.env
      CANDIDATE_REVISION: ${DEMO_INFRA_REVISION:?DEMO_INFRA_REVISION is required}
      DEMO_CLEANUP_ACK: DROP_LEGACY_SYNTHETIC_SCHEMA
    secrets:
      - demo_mysql_root_password
    volumes:
      - ${RECOVERY_BUNDLE:?RECOVERY_BUNDLE is required}:/recovery:ro
      - ${LIVE_VALIDATION_RECEIPT_FILE:?LIVE_VALIDATION_RECEIPT_FILE is required}:/validation/live-validation.env:ro
      - ${RECOVERY_KEY_FILE:?RECOVERY_KEY_FILE is required}:/run/secrets/recovery_key:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - data
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    logging: *bounded-logging

  jenkins-controller:
    build:
      context: .
      dockerfile: docker/demo-jenkins/controller/Dockerfile
      args:
        DEMO_INFRA_REVISION: ${DEMO_INFRA_REVISION:?DEMO_INFRA_REVISION is required}
    image: open-metadata-sync-demo-controller:${DEMO_IMAGE_TAG:?DEMO_IMAGE_TAG is required}
    container_name: open-metadata-sync-public-demo-controller
    restart: unless-stopped
    secrets:
      - agent_ssh_key
      - demo_mysql_password
      - demo_mysql_live_password
    volumes:
      - public-demo-jenkins-home:/var/jenkins_home
    networks:
      - app
    depends_on:
      mysql:
        condition: service_healthy
      jenkins-agent:
        condition: service_started
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 300
    security_opt:
      - no-new-privileges:true
    logging: *bounded-logging

  jenkins-agent:
    build:
      context: .
      dockerfile: docker/demo-jenkins/agent/Dockerfile
      args:
        DEMO_REVISION: c38fa23ff126267bf97409a29c3f1c9d851b2492
        DEMO_INFRA_REVISION: ${DEMO_INFRA_REVISION:?DEMO_INFRA_REVISION is required}
    image: open-metadata-sync-demo-agent:${DEMO_IMAGE_TAG:?DEMO_IMAGE_TAG is required}
    container_name: open-metadata-sync-public-demo-agent
    restart: unless-stopped
    secrets:
      - agent_ssh_pubkey
    networks:
      - app
      - data
      - provider
    depends_on:
      mysql:
        condition: service_healthy
      crossref-proxy:
        condition: service_healthy
    tmpfs:
      - /home/jenkins/agent:size=2g,exec,uid=1000,gid=1000,mode=0700
    mem_limit: 1024m
    cpus: 1.5
    pids_limit: 400
    security_opt:
      - no-new-privileges:true
    logging: *bounded-logging

  crossref-proxy:
    build:
      context: .
      dockerfile: docker/crossref-proxy/Dockerfile
      args:
        DEMO_INFRA_REVISION: ${DEMO_INFRA_REVISION:?DEMO_INFRA_REVISION is required}
    image: open-metadata-sync-demo-crossref-proxy:${DEMO_IMAGE_TAG:?DEMO_IMAGE_TAG is required}
    container_name: open-metadata-sync-public-demo-crossref-proxy
    restart: unless-stopped
    environment:
      CROSSREF_MAILTO_FILE: /run/secrets/crossref_mailto
    secrets:
      - crossref_mailto
    networks:
      - provider
      - provider-egress
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *bounded-logging

  gateway:
    build:
      context: .
      dockerfile: docker/demo-gateway/Dockerfile
      args:
        DEMO_INFRA_REVISION: ${DEMO_INFRA_REVISION:?DEMO_INFRA_REVISION is required}
    image: open-metadata-sync-demo-gateway:${DEMO_IMAGE_TAG:?DEMO_IMAGE_TAG is required}
    container_name: open-metadata-sync-public-demo-gateway
    restart: unless-stopped
    environment:
      JENKINS_ORIGIN: http://jenkins-controller:8080
      ADMISSION_RESERVATION_SECONDS: "10"
    ports:
      - "127.0.0.1:9092:8080"
    networks:
      - edge
      - app
    depends_on:
      jenkins-controller:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *bounded-logging

networks:
  edge: {}
  app:
    internal: true
  data:
    internal: true
  provider:
    internal: true
  provider-egress: {}

volumes:
  public-demo-mysql-data:
    name: open-metadata-sync-public-demo-mysql-data
  public-demo-jenkins-home:
    name: open-metadata-sync-public-demo-jenkins-home

secrets:
  agent_ssh_key:
    file: .demo-secrets/agent_ssh_key
  agent_ssh_pubkey:
    file: .demo-secrets/agent_ssh_key.pub
  demo_mysql_password:
    file: .demo-secrets/mysql-password
  demo_mysql_root_password:
    file: .demo-secrets/mysql-root-password
  demo_mysql_live_password:
    file: .demo-secrets/mysql-live-password
  crossref_mailto:
    file: .demo-secrets/crossref-mailto
